{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<section class="access-denied" aria-labelledby="error-title">
  <p class="eyebrow">404 / Page not found</p>
  <h1 id="error-title">This trail ends here.</h1>
  <p class="intro">The page or record is unavailable. Check the address or return to your dashboard.</p>
  <a class="button" href="{% url 'dashboard' %}">Return to dashboard</a>
</section>
{% endblock %}
